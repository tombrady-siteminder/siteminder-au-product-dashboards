name: Process new dashboards

on:
  push:
    branches: [main]

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install staticrypt
        run: npm install -g staticrypt@3.5.4

      - name: Add Heap + favicon + encrypt any unencrypted pages
        env:
          STATICRYPT_PASSWORD: ${{ secrets.STATICRYPT_PASSWORD }}
        run: |
          python3 << 'PYEOF'
          import os, subprocess, sys

          SALT = "2679e05bf9062f280676dc7dc9cf97fd"
          HEAP_SNIPPET = '<script>window.heap=window.heap||[],heap.load=function(e,t){window.heap.appid=e,window.heap.config=t=t||{};var r=document.createElement("script");r.type="text/javascript",r.async=!0,r.src="https://cdn.heapanalytics.com/js/heap-"+e+".js";var a=document.getElementsByTagName("script")[0];a.parentNode.insertBefore(r,a);for(var n=function(e){return function(){heap.push([e].concat(Array.prototype.slice.call(arguments,0)))}},p=["addEventProperties","addUserProperties","clearEventProperties","identify","resetIdentity","removeEventProperty","setEventProperties","track","unsetEventProperty"],o=0;o<p.length;o++)heap[p[o]]=n(p[o])};heap.load("1527560549");<\/script>'
          FAVICON_TAG = '<link rel="icon" type="image/png" href="/siteminder-au-product-dashboards/favicon.png">'
          PASSWORD = os.environ["STATICRYPT_PASSWORD"]

          changed = False

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if not d.startswith(".")]
              if "index.html" not in files:
                  continue
              path = os.path.join(root, "index.html")
              with open(path) as f:
                  content = f.read()
              if "staticrypt-html" in content:
                  continue
              print(f"Processing: {path}")
              modified = False
              if "favicon.png" not in content and "<meta name=\"viewport\"" in content:
                  content = content.replace('<meta name="viewport"', f'{FAVICON_TAG}\n  <meta name="viewport"', 1)
                  modified = True
              if "1527560549" not in content and "</head>" in content:
                  content = content.replace("</head>", f"  {HEAP_SNIPPET}\n</head>", 1)
                  modified = True
              if modified:
                  with open(path, "w") as f:
                      f.write(content)
              dirname = os.path.dirname(path) or "."
              result = subprocess.run(
                  ["staticrypt", "index.html", "-p", PASSWORD, "--remember", "30", "-s", SALT, "-d", ".", "--short"],
                  cwd=dirname, capture_output=True, text=True
              )
              if result.returncode != 0:
                  print(f"ERROR encrypting {path}: {result.stderr}", file=sys.stderr)
              else:
                  print(f"  encrypted {path}")
                  changed = True

          print("Pages processed." if changed else "No unencrypted pages found - nothing to do.")
          PYEOF

      - name: Commit processed pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git add -A
            git commit -m "Auto: add Heap + favicon + encrypt new dashboard pages"
            git push
          fi
